<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金山承天宮會員專區</title><link rel="stylesheet" href="style.css"></head><body><main><header><span class="eyebrow">金山承天宮 · 發財金</span><h1>我的會員專區</h1><p>隨身出示會員條碼，查閱歷年借款與奉還紀錄。</p></header><p id="status" role="status" aria-live="polite">正在確認 LINE 登入…</p><section id="binding" hidden><h2>📱 綁定會員資料</h2><p>首次使用，請填寫廟方登記的完整姓名與手機號碼。</p><form id="bind-form"><label for="name">登記姓名</label><input id="name" autocomplete="name" maxlength="80" required placeholder="請輸入完整姓名"><label for="phone">登記手機號碼</label><input id="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" required placeholder="09xxxxxxxx"><label class="consent"><input id="consent" type="checkbox" required>我已閱讀<a href="privacy.html" target="_blank" rel="noopener">資料使用說明</a>，同意將會員資料綁定至目前 LINE 帳號。</label><button id="bind" type="submit">確認資料並綁定 LINE</button></form><p class="note">請使用本人的資料。若登記資料有誤，請洽廟方協助。</p></section><section id="card" hidden><span class="eyebrow">會員條碼</span><h2 id="member-name"></h2><p id="member-id"></p><div id="qr"></div><p class="note">辦理借還時，請出示給工作人員掃描。<br>掃描後仍需工作人員登入，才可查閱資料。</p><button id="refresh" class="secondary">重新整理紀錄</button></section><section id="records" hidden><h2>💰 歷年借款與奉還紀錄</h2><div id="year-list"></div></section><footer><p>資料如有疑問，請洽廟方工作人員。</p><button id="unlink" class="text-button" hidden>解除 LINE 綁定</button><p><a href="privacy.html">資料使用說明</a></p></footer></main><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script src="../vendor/qrcode.js"></script><script src="app.js"></script></body></html>
