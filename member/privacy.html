<body><main><header><span class="eyebrow">金山承天宮 · 會員服務</span><h1>會員資料使用說明</h1></header><section>
<h2>資料用途</h2>
<p>本專區使用您的登記姓名、手機號碼及 LINE 帳號識別資訊，確認並綁定廟方會員資料，提供會員條碼、歷年借款與奉還紀錄。</p>
<h2>會員條碼</h2>
<p>辦理借款或奉還時，可出示會員條碼供廟方工作人員查詢。實際辦理情形請以廟方登記紀錄為準。</p>
<h2>解除綁定</h2>
<p>您可於會員專區解除 LINE 綁定，解除後原會員條碼即失效。解除綁定不會刪除廟方原有的會員及借還紀錄。</p>
<h2>資料更正與聯絡</h2>
<p>請使用本人的登記資料。若姓名、手機號碼或借還紀錄有誤，或對資料使用有疑問，請透過金山承天宮官方 LINE 聯絡工作人員協助。</p>
<p><a href="./">返回會員專區</a></p>
</section></main></body></html>
